name: autofix.ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  autofix:
    # GitHub-hosted, not Blacksmith, for the reason recorded in
    # ci.format.yml: a label the fork's plan does not cover queues until the
    # run is reaped, so this bot never pushed a formatting fix here.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: 'package.json'
      # Frozen so a formatting pass can never resolve new dependency versions
      # and push a mutated bun.lock back to the PR branch.
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format
        run: bun run format
      - name: Apply fixes
        uses: autofix-ci/action@v1
        with:
          commit-message: 'chore: apply formatting'
