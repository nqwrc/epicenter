# The compile gate for the Epicenter Tauri host, and the only place a desktop
# installer is currently produced.
#
# Nothing under .github/workflows/ compiled Rust between 2d0d3ed2f (which
# retired the Whispering desktop workflows and their composite setup action)
# and this file, so a change under apps/epicenter/src-tauri/ could merge
# without ever being compiled. This closes that hole and hands a reviewer a
# build to download.
#
# Why a full `tauri build` per platform instead of a cheap `cargo check` leg:
#   - Most of the native code sits behind `cfg(windows)` and
#     `cfg(target_os = "macos")` (the `windows` crate, winreg, enigo, objc2,
#     accessibility-sys, tauri-nspanel). A check job on a third OS resolves a
#     different dependency set and would miss exactly the code most likely to
#     break.
#   - `cargo check` is not meaningfully cheaper here. transcribe-cpp-sys
#     configures and compiles ggml through CMake in its build script, and build
#     scripts run for `check` too, so the C++ compile dominates either way.
#   - Once the crate is linked, bundling costs minutes and yields the .msi,
#     NSIS .exe, and .app a human can actually install.
#
# Why the Windows leg audits the installers it uploads: on Windows x86_64
# transcribe-cpp is built with `dynamic-backends`, so the ggml runtime ships as
# loose DLLs rather than being linked in. Nothing in tauri.conf.json maps them,
# and nothing should: tauri v2 has a `bundle.linux.<fmt>.files` mapping but no
# Windows equivalent. The DLLs reach the .msi and NSIS payload because
# tauri-bundler packs every .dll sitting beside the executable in the cargo
# target directory, which is also how the loader finds them at run time. That
# is an implicit contract between three crates, so a build can compile, link,
# bundle, and go green while producing an installer whose app registers zero
# compute devices. build.rs asserts `copied > 0` at staging time, which proves
# nothing about the installer. The audit below is the only thing that does.
# Do not "fix" a failure there by inventing a bundle.windows files mapping.
#
# Why no Linux leg: tauri-bundler intersects `bundle.targets` with the target
# platform's own list, so this config's ["app", "msi", "nsis"] resolves to the
# .app on macOS, msi plus nsis on Windows, and an EMPTY list on Linux. A Linux
# job would compile and package nothing. Adding one first requires deciding on
# deb/rpm/AppImage targets and a `bundle.linux` files mapping for the
# transcribe-cpp shared libraries build.rs stages into src-tauri/transcribe-libs.
#
# This workflow never publishes: no release, no tag, no push, no secrets.
# auto.release.yml owns publishing and stays `if: false` until v8.0.0 is tagged
# and GH_ACTIONS_PAT exists. Re-enabling it is a separate decision with its own
# review, and must not ride along with adding a compile gate.
#
# macOS signing is deliberately left as-is. tauri.conf.json declares
# `signingIdentity: "-"` (ad-hoc), which needs no certificate and no secret, so
# the .app produced here runs on the machine that built it and is a smoke test,
# not a distributable. Real Developer ID signing plus notarization is a product
# decision with its own secret surface and does not belong in a CI file.

name: Epicenter desktop build

# No `paths:` filter. `beforeBuildCommand` runs `bun run build:desktop`, which
# builds the Home frontend plus the Whispering and Honeycrisp bundles and
# compiles the Bun sidecar, so almost any workspace package can break this
# build. A filter honest about that blast radius would be `**`, and a filter
# that misses a breaking change is worse than a wasted run. On pull requests
# `cancel-in-progress` below bounds the cost of a push-heavy branch instead. If
# the spend ever needs cutting, gate on an explicit label, not on paths.
#
# No `branches:` filter on `pull_request` either, matching ci.format.yml and
# ci.runtime-parity.yml. A gate that only fires on PRs based on main lets a
# stacked PR merge uncompiled Rust into its parent feature branch, and the
# break then surfaces in the aggregate PR with several changes to bisect. The
# `push` trigger is main-only on purpose: that leg answers "does main compile",
# and every other branch already gets the answer from its own PR.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Pull requests only. On main this group keys on the ref, so two merges
  # minutes apart would cancel the first one's build, and a red second run
  # could not be attributed to either merge. Answering that question is the
  # whole reason the push leg exists, and a 20 minute Rust build is not
  # something to re-run by hand to recover it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.suffix }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    # No other workflow here sets one, because none of them download and run an
    # installer on a paid multi-core runner. A cold leg is minutes, not hours;
    # anything past this is hung, not slow, and `cancel-in-progress` cannot
    # reclaim it because it only cancels older runs of the same PR.
    timeout-minutes: 90

    strategy:
      # One platform failing must not hide whether the other compiles.
      fail-fast: false
      matrix:
        include:
          # Blacksmith labels: this repo ran the retired Whispering matrix on
          # these exact images, where a cold Windows Tauri build took roughly 6
          # minutes against roughly 22 on a GitHub-hosted runner. If the
          # Blacksmith plan no longer covers Windows or macOS the job will queue
          # forever rather than fail; swap in `windows-latest` and `macos-15`
          # here and nothing else in this file changes.
          - runner: blacksmith-8vcpu-windows-2025
            os: windows
            suffix: windows-x86_64
          # macOS is arm64 only, on purpose. scripts/build-sidecar.ts refuses
          # when TAURI_ENV_TARGET_TRIPLE differs from the rustc host triple,
          # because `bun build --compile` cannot produce the sidecar for another
          # architecture. Covering Intel Macs means an x86_64 runner, not a
          # cross-compile flag.
          - runner: blacksmith-6vcpu-macos-15
            os: macos
            suffix: macos-aarch64

    env:
      CI: true
      # ggml's CMakeLists still declares `cmake_minimum_required(VERSION 3.5)`,
      # which CMake 4 rejects outright. Runner images ship CMake 4, so every
      # transcribe-cpp-sys configure needs this or the build fails before
      # compiling a line of C++.
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Vulkan is the GPU backend transcribe-cpp uses on Windows x86_64
      # (`features = ["dynamic-backends", "vulkan"]` in Cargo.toml) and is not
      # preinstalled on any runner image. Pinned so a LunarG registry change
      # cannot move the build out from under us.
      - name: Install Vulkan SDK (Windows)
        if: ${{ matrix.os == 'windows' }}
        shell: pwsh
        env:
          VULKAN_SDK_VERSION: 1.3.290.0
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP "VulkanSDK-$env:VULKAN_SDK_VERSION.exe"
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$env:VULKAN_SDK_VERSION/windows/VulkanSDK-$env:VULKAN_SDK_VERSION-Installer.exe" -OutFile $installer
          # -PassThru plus a Test-Path, because the install is silent and its
          # argument set belongs to LunarG. Without both, a changed flag or an
          # aborted install leaves this step green, VULKAN_SDK pointing at a
          # directory that does not exist, and the failure surfacing twenty
          # minutes later as a find_package(Vulkan) error that reads like a
          # source problem.
          $proc = Start-Process -FilePath $installer -ArgumentList "--accept-licenses --default-answer --confirm-command install" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { Write-Host "::error::Vulkan SDK installer exited $($proc.ExitCode)"; exit 1 }
          $sdk = "C:\VulkanSDK\$env:VULKAN_SDK_VERSION"
          if (-not (Test-Path $sdk)) { Write-Host "::error::Vulkan SDK installer reported success but $sdk does not exist"; exit 1 }
          "VULKAN_SDK=$sdk" >> $env:GITHUB_ENV
          "$sdk\Bin" >> $env:GITHUB_PATH

      # ggml-vulkan does `find_package(SPIRV-Headers CONFIG REQUIRED)` at
      # configure time, and the 1.3.290.0 SDK pinned above exposes no
      # discoverable SPIRV-HeadersConfig.cmake, so the CONFIG-mode lookup fails
      # and the x86_64 build aborts. vcpkg is preinstalled on the Windows runner
      # images and carries the header-only package. The Cargo.toml comment on
      # the `cfg(all(windows, target_arch = "x86_64"))` dependency records the
      # same requirement.
      #
      # That is version-scoped, not permanent: 1.4.357.0 does ship the package,
      # at Lib/cmake/SPIRV-Headers, and pointing CMAKE_PREFIX_PATH at the SDK
      # root alone gets past this lookup (verified on a Windows workstation,
      # 2026-09-03). Whoever bumps VULKAN_SDK_VERSION into 1.4 should check
      # whether this whole step can go.
      - name: Install SPIRV-Headers for the Vulkan backend (Windows)
        if: ${{ matrix.os == 'windows' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          vcpkg install spirv-headers:x64-windows
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::vcpkg install spirv-headers:x64-windows exited $LASTEXITCODE"; exit 1 }
          # vcpkg can be on PATH while VCPKG_INSTALLATION_ROOT is not set, which
          # is the shape that fails quietly: the install succeeds, string
          # interpolation yields the literal "/installed/x64-windows", and that
          # garbage prefix reaches CMAKE_PREFIX_PATH looking plausible in the
          # log. Resolve the root or stop here, rather than handing CMake a path
          # that will fail later with no trace back to this step.
          if (-not $env:VCPKG_INSTALLATION_ROOT) { Write-Host "::error::VCPKG_INSTALLATION_ROOT is unset; cannot resolve the vcpkg prefix for SPIRV-Headers"; exit 1 }
          $prefix = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" -replace '\\','/'
          if (-not (Test-Path $prefix)) { Write-Host "::error::vcpkg prefix $prefix does not exist after installing spirv-headers"; exit 1 }
          $combined = if ($env:CMAKE_PREFIX_PATH) { "$prefix;$env:CMAKE_PREFIX_PATH" } else { $prefix }
          Add-Content $env:GITHUB_ENV "CMAKE_PREFIX_PATH=$combined"
          Write-Host "CMAKE_PREFIX_PATH=$combined"

      # transcribe-cpp-sys's CMake build nests generator directories deep enough
      # to exceed Windows MAX_PATH from a normal workspace path, so the target
      # directory moves to a drive-root path. Everything downstream that reads
      # build output on Windows must use CARGO_TARGET_DIR, not
      # src-tauri/target.
      - name: Shorten the Windows build path
        if: ${{ matrix.os == 'windows' }}
        shell: pwsh
        run: |
          $drive = Split-Path -Qualifier $env:GITHUB_WORKSPACE
          $targetDir = Join-Path $drive "t"
          New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
          "CARGO_TARGET_DIR=$targetDir" >> $env:GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: 'package.json'

      # setup-bun caches the Bun binary, not the packages it downloads. bun.lock
      # is committed, so keying on it makes a repeat install a copy from disk.
      - name: Cache the Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './apps/epicenter/src-tauri -> target'
          # Windows redirects CARGO_TARGET_DIR to a drive-root path this action
          # does not know about, so only the registry and git caches survive
          # there and the CMake build reruns cold every time. Teaching the cache
          # about the redirected directory needs a real-runner experiment and a
          # size budget, so it stays a follow-up rather than an untested guess.
          cache-targets: ${{ matrix.os != 'windows' }}
          # Restore everywhere, save only from main. A macOS target directory
          # carrying transcribe-cpp-sys's ggml build output is over a gigabyte
          # even after rust-cache prunes it, and the repo shares a 10 GB cache
          # across every workflow. Saving per PR branch would be pure loss:
          # GitHub scopes cache reads so one PR can never read another's entry,
          # while a few branch entries evict main's, and main's is the one every
          # PR restores from. It would also evict the Bun cache above, which is
          # smaller and therefore first out under LRU.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # `postinstall` runs `build:declarations`, so the .d.ts files the app
      # builds against exist after this step with no separate build call.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # One command is the whole build. tauri.conf.json's `beforeBuildCommand`
      # is `bun run build:desktop`, which cleans dist, builds Home, Whispering,
      # and Honeycrisp, then compiles the Bun sidecar into
      # src-tauri/binaries/epicenter-host-<triple>, which `externalBin`
      # requires. Driving the app's own script keeps CI on the identical path a
      # maintainer runs locally, the same reason deploy.cloudflare.yml calls the
      # repo's pinned wrangler instead of a third-party action.
      - name: Build the desktop host
        run: bun run --cwd apps/epicenter desktop:build

      # Collect into one workspace-relative directory so the upload step is
      # identical on both platforms. On Windows the bundle lives under the
      # redirected CARGO_TARGET_DIR, which upload-artifact will not read.
      - name: Stage Windows installers
        if: ${{ matrix.os == 'windows' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Join-Path $env:CARGO_TARGET_DIR 'release\bundle'
          $out = Join-Path $env:GITHUB_WORKSPACE 'ci-artifacts'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $msi = @(Get-ChildItem (Join-Path $bundle 'msi') -Filter *.msi -ErrorAction SilentlyContinue)
          $nsis = @(Get-ChildItem (Join-Path $bundle 'nsis') -Filter *.exe -ErrorAction SilentlyContinue)
          # bundle.targets names both, so a run that silently produced one of
          # them is a regression in the bundle config, not a partial success.
          if ($msi.Count -eq 0) { Write-Host "::error::tauri build produced no .msi under $bundle"; exit 1 }
          if ($nsis.Count -eq 0) { Write-Host "::error::tauri build produced no NSIS .exe under $bundle"; exit 1 }
          ($msi + $nsis) | ForEach-Object { Copy-Item $_.FullName -Destination $out }

      # Prove the two installers about to be uploaded can actually run. See the
      # file header for why nothing in tauri.conf.json can express this and why
      # a green build is not evidence on its own. This inspects the staged
      # copies, so it audits the exact bytes the artifact carries.
      #
      # Presence only. The retired Whispering workflow also ran a devices()
      # smoke through a `transcribe_cpp_devices` cargo example to prove the
      # loader resolves the modules; apps/epicenter has no such example, and
      # writing one is a source change, not a CI change.
      - name: Audit the Windows installers carry the transcribe-cpp runtime
        if: ${{ matrix.os == 'windows' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script:fail = $false

          # ggml-cpu is the load-bearing one, not "any ggml DLL". dynamic-backends
          # sets GGML_BACKEND_DL, which builds each backend as its own loadable
          # module, and the CPU module is what keeps a machine with no usable
          # Vulkan device from registering zero devices. transcribe.dll is the
          # shared runtime itself.
          function Assert-Runtime([string]$label, [string[]]$dllNames) {
            Write-Host "${label}: $($dllNames -join ', ')"
            if ($dllNames -notcontains 'transcribe.dll') {
              Write-Host "::error::$label is missing transcribe.dll"; $script:fail = $true
            }
            if (-not ($dllNames | Where-Object { $_ -like 'ggml-cpu*.dll' })) {
              Write-Host "::error::$label is missing a ggml-cpu*.dll backend"; $script:fail = $true
            }
          }
          function Dlls([string]$dir) {
            @(Get-ChildItem $dir -Recurse -Filter *.dll -ErrorAction SilentlyContinue | ForEach-Object Name)
          }

          # Checked first so a failure says whether the libraries were never
          # built or were built and then not packaged. Keyed on
          # CARGO_MANIFEST_DIR in build.rs, so it is inside the workspace even
          # though CARGO_TARGET_DIR is redirected off it on Windows.
          Assert-Runtime 'staged transcribe-libs' (Dlls 'apps/epicenter/src-tauri/transcribe-libs')

          $out = Join-Path $env:GITHUB_WORKSPACE 'ci-artifacts'

          # WiX MSI: an administrative install extracts the payload to a
          # directory without elevation and without touching the registry.
          $msi = Get-ChildItem $out -Filter *.msi | Select-Object -First 1
          $msiDir = Join-Path $env:RUNNER_TEMP 'msi-audit'
          $msiLog = Join-Path $env:RUNNER_TEMP 'msi-audit.log'
          $proc = Start-Process msiexec.exe -ArgumentList "/a `"$($msi.FullName)`" /qn /L*v `"$msiLog`" TARGETDIR=`"$msiDir`"" -Wait -NoNewWindow -PassThru
          if ($proc.ExitCode -ne 0) { Write-Host "::error::msiexec /a exited $($proc.ExitCode) extracting $($msi.Name); see $msiLog"; exit 1 }
          Assert-Runtime "MSI ($($msi.Name))" (Dlls $msiDir)

          # NSIS .exe: 7-Zip reads NSIS installers directly, so the real payload
          # is inspected without running the installer. 7z ships on the Windows
          # runner images. Its exit 1 is a warning (the $PLUGINSDIR stubs), so
          # native exit codes must not auto-throw here; 2 and up is fatal and
          # is checked explicitly.
          $PSNativeCommandUseErrorActionPreference = $false
          $exe = Get-ChildItem $out -Filter *.exe | Select-Object -First 1
          $nsisDir = Join-Path $env:RUNNER_TEMP 'nsis-audit'
          & 7z x "-o$nsisDir" $exe.FullName -y > $null
          if ($LASTEXITCODE -ge 2) { Write-Host "::error::7z failed to extract $($exe.Name) (exit $LASTEXITCODE)"; exit 1 }
          Assert-Runtime "NSIS ($($exe.Name))" (Dlls $nsisDir)

          # Read the file header before reaching for tauri.conf.json: there is
          # no bundle.windows files mapping in tauri v2, so the fix is upstream
          # of the bundler, in what the build leaves beside the executable.
          if ($script:fail) { Write-Host "::error::a Windows installer would ship without the transcribe-cpp runtime"; exit 1 }
          Write-Host "Staging dir, MSI, and NSIS installer all carry transcribe.dll plus a ggml-cpu backend."

      - name: Stage the macOS app bundle
        if: ${{ matrix.os == 'macos' }}
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="apps/epicenter/src-tauri/target/release/bundle/macos"
          # Check the directory before running find. Under `set -e` with
          # pipefail, `X="$(find missing | head -1)"` aborts the step on find's
          # own exit status, so the annotation below would never print for the
          # likeliest cause: the bundle moving (a `--target` flag puts it under
          # target/<triple>/release/bundle) or the App package type dropping out
          # of bundle.targets.
          test -d "$BUNDLE" || { echo "::error::no macOS bundle directory at $BUNDLE"; exit 1; }
          APP="$(find "$BUNDLE" -maxdepth 1 -name '*.app' -type d | head -1)"
          test -n "$APP" || { echo "::error::tauri build produced no .app bundle under $BUNDLE"; exit 1; }
          mkdir -p ci-artifacts
          # ditto, not zip: upload-artifact's own archive drops the executable
          # bit and the symlink layout inside Contents/, which invalidates the
          # ad-hoc signature and leaves a downloaded .app that will not launch.
          # ditto round-trips permissions, symlinks, and extended attributes.
          ditto -c -k --keepParent "$APP" "ci-artifacts/Epicenter-${{ matrix.suffix }}.app.zip"

      # Artifacts only. Publishing belongs to auto.release.yml, which is
      # disabled on purpose; nothing here creates a release or pushes a tag.
      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: epicenter-${{ matrix.suffix }}
          path: ci-artifacts/*
          if-no-files-found: error
          retention-days: 14
